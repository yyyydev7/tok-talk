name: ${COMPOSE_PROJECT_NAME:-tok-talk}

services:
  db:
    image: mariadb:11.4.13-noble
    environment:
      MARIADB_DATABASE: ${DB_NAME:-tok_talk}
      MARIADB_USER: ${DB_USER:-toktalk}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run infra/scripts/init_env.py first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run infra/scripts/init_env.py first}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-13306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      target: development
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Run infra/scripts/init_env.py first}
      JWT_ISSUER: ${JWT_ISSUER:-simple-auth-server}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-tok_talk}
      DB_USER: ${DB_USER:-toktalk}
      DB_PASSWORD: ${DB_PASSWORD:?Run infra/scripts/init_env.py first}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174}
    ports:
      - "127.0.0.1:${AUTH_PORT:-8080}:8080"

  indexer:
    build:
      context: ./datapipeline
    environment:
      DATA_DIR: /data
      NIOSH_PDF_PATH: /app/resources/NIOSH.pdf
      KOSHA_API_KEY: ${KOSHA_API_KEY:-}
      KOSHA_REFRESH_HOURS: ${KOSHA_REFRESH_HOURS:-24}
      HF_HOME: /models
    volumes:
      - ./datapipeline/data:/data
      - embedding_cache:/models

  rag:
    build:
      context: ./rag
      target: development
    depends_on:
      indexer:
        condition: service_completed_successfully
    environment:
      PORT: "8001"
      JWT_SECRET: ${JWT_SECRET:?Run infra/scripts/init_env.py first}
      JWT_ISSUER: ${JWT_ISSUER:-simple-auth-server}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-tok_talk}
      DB_USER: ${DB_USER:-toktalk}
      DB_PASSWORD: ${DB_PASSWORD:?Run infra/scripts/init_env.py first}
      DATA_DIR: /data
      RAG_INDEX_PATH: ${RAG_INDEX_PATH:-/data/indexes/current}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      VOICE_CHAT_MODEL: ${VOICE_CHAT_MODEL:-gpt-4o-mini}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_multilingual_v2}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v2}
      ELEVENLABS_STT_LANGUAGE: ${ELEVENLABS_STT_LANGUAGE:-kor}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
      ELEVENLABS_VOICE_SPEED: ${ELEVENLABS_VOICE_SPEED:-1.0}
      ELEVENLABS_TIMEOUT_SECONDS: ${ELEVENLABS_TIMEOUT_SECONDS:-60}
      ELEVENLABS_MAX_AUDIO_BYTES: ${ELEVENLABS_MAX_AUDIO_BYTES:-10485760}
    volumes:
      - ./rag/app:/app/app
      - ./datapipeline/data:/data:ro
    ports:
      - "127.0.0.1:${RAG_PORT:-8001}:8001"

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_AUTH_BASE_URL: ${VITE_AUTH_BASE_URL:-http://localhost:8080}
      VITE_RAG_BASE_URL: ${VITE_RAG_BASE_URL:-http://localhost:8001}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5174"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db_data:
  embedding_cache:
