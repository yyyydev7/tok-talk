# Inactive template: GitHub only discovers workflows in .github/workflows/.
# Move this file to .github/workflows/ci.yml to enable it later.
name: Scaffold checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon build

  rag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked
      - run: uv run --locked python -m compileall -q app

  datapipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q datapipeline/pipeline

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python infra/scripts/init_env.py
      - run: docker compose --env-file .env -f compose.dev.yaml config --quiet
      - run: docker compose --env-file .env -f compose.demo.yaml config --quiet
      - run: docker compose --env-file .env -f compose.dev.yaml up --build -d --wait --wait-timeout 180
      - run: python infra/tests/e2e/smoke.py
      - name: Service status
        if: failure()
        run: docker compose --env-file .env -f compose.dev.yaml ps --all
      - name: Stop isolated CI stack
        if: always()
        run: docker compose --env-file .env -f compose.dev.yaml down --volumes

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python infra/scripts/init_env.py --demo
      - run: docker compose --env-file .env.demo -f compose.demo.yaml up --build -d --wait --wait-timeout 180
      - run: python infra/tests/e2e/proxy_smoke.py
      - name: Service status
        if: failure()
        run: docker compose --env-file .env.demo -f compose.demo.yaml ps --all
      - name: Stop isolated CI demo stack
        if: always()
        run: docker compose --env-file .env.demo -f compose.demo.yaml down --volumes
