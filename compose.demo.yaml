name: ${COMPOSE_PROJECT_NAME:-tok-talk-demo}

services:
  db:
    image: mariadb:11.4.13-noble
    environment:
      MARIADB_DATABASE: ${DB_NAME:-tok_talk}
      MARIADB_USER: ${DB_USER:-toktalk}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Provide demo DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Provide demo DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      target: release
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Provide demo JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-simple-auth-server}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-tok_talk}
      DB_USER: ${DB_USER:-toktalk}
      DB_PASSWORD: ${DB_PASSWORD:?Provide demo DB_PASSWORD}

  indexer:
    build:
      context: ./datapipeline
    environment:
      DATA_DIR: /data
      NIOSH_PDF_PATH: /app/resources/NIOSH.pdf
      KOSHA_API_KEY: ${KOSHA_API_KEY:-}
      KOSHA_REFRESH_HOURS: ${KOSHA_REFRESH_HOURS:-24}
      HF_HOME: /models
    volumes:
      - ./datapipeline/data:/data
      - embedding_cache:/models

  rag:
    build:
      context: ./rag
      target: release
    depends_on:
      indexer:
        condition: service_completed_successfully
    environment:
      PORT: "8001"
      JWT_SECRET: ${JWT_SECRET:?Provide demo JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-simple-auth-server}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-tok_talk}
      DB_USER: ${DB_USER:-toktalk}
      DB_PASSWORD: ${DB_PASSWORD:?Provide demo DB_PASSWORD}
      DATA_DIR: /data
      RAG_INDEX_PATH: ${RAG_INDEX_PATH:-/data/indexes/current}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      VOICE_CHAT_MODEL: ${VOICE_CHAT_MODEL:-gpt-4o-mini}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_multilingual_v2}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v2}
      ELEVENLABS_STT_LANGUAGE: ${ELEVENLABS_STT_LANGUAGE:-kor}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
      ELEVENLABS_TIMEOUT_SECONDS: ${ELEVENLABS_TIMEOUT_SECONDS:-60}
      ELEVENLABS_MAX_AUDIO_BYTES: ${ELEVENLABS_MAX_AUDIO_BYTES:-10485760}
    volumes:
      - ./datapipeline/data:/data:ro

  frontend:
    build:
      context: ./frontend
      target: release
      args:
        VITE_AUTH_BASE_URL: ""
        VITE_RAG_BASE_URL: ""

  proxy:
    image: nginx:1.30.6-alpine3.24
    volumes:
      - ./infra/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${DEMO_HTTP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      rag:
        condition: service_healthy

volumes:
  db_data:
  embedding_cache:
