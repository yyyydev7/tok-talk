<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
<title id="title">톡,talk 서비스 아키텍처 — 실제 구현 기준</title>
<desc id="desc">Vue 브라우저가 Nginx 프록시 8088을 통해 Java 인증 서버 8080과 FastAPI 8001을 호출한다. Java는 MariaDB에 회원을 저장하고 HttpOnly JWT 쿠키를 발급한다. FastAPI는 쿠키를 자체 검증하고 일반 GPT 질문, ElevenLabs 음성, 별도 RAG API를 제공한다. KOSHA와 NIOSH를 수집하는 Python indexer가 BGE-M3 임베딩과 FAISS 파일 인덱스를 생성한다. 기본 질문 화면은 일반 GPT를 사용하며 RAG 답변 API와는 분리돼 있다.</desc>
